# uv environment for this repo. Mirrors requirements.txt (scorer) and requirements-starter.txt
# (notebooks); uv.lock pins every version so submissions regenerate identically.
#
#   uv sync                       # scorer + starter + notebooks
#   uv run python evaluation/run_evaluation.py
[project]
name = "mtah-2027-possession"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
]

[dependency-groups]
starter = [
    "kloppy==3.18.0",
    "matplotlib",
    "notebook",
]
# seq/ and external/score_seq.py; mirrors requirements-seq.txt. Not in default-groups:
# `uv sync --group seq`.
seq = [
    "scikit-learn==1.6.1",
    "threadpoolctl==3.7.0",
]
# deep/ (the learned players-only model); mirrors requirements-deep.txt. Not in default-groups:
# `uv sync --group deep`, or pip install -r.
deep = [
    "torch==2.15.0",
]

[tool.uv]
package = false
default-groups = ["starter"]
