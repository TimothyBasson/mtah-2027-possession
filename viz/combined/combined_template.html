<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match viewer</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#1f1e1c;--muted:#6b6a65;--border:rgba(0,0,0,.12);--grass:#e7f0e1;--line:#9fb894;--home:#185FA5;--homel:#E6F1FB;--away:#D85A30;--awayl:#FAECE7;--dead:#888780;--none:#d3d1c7;--ball:#1f1e1c;--ok:#3B6D11;--bad:#A32D2D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--card:#252524;--text:#ecebe6;--muted:#a3a29c;--border:rgba(255,255,255,.14);--grass:#1f2a1c;--line:#4d6645;--home:#85B7EB;--homel:#0C447C;--away:#F0997B;--awayl:#712B13;--dead:#888780;--none:#444441;--ball:#f4f3ee;--ok:#97C459;--bad:#F09595}}
:root[data-theme="dark"]{--bg:#1b1b1a;--card:#252524;--text:#ecebe6;--muted:#a3a29c;--border:rgba(255,255,255,.14);--grass:#1f2a1c;--line:#4d6645;--home:#85B7EB;--homel:#0C447C;--away:#F0997B;--awayl:#712B13;--dead:#888780;--none:#444441;--ball:#f4f3ee;--ok:#97C459;--bad:#F09595}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
/* The page fits the window without scrolling: the panel takes a height that scales with the screen,
   the strips and controls their natural height, and the video whatever is left. The video box is a
   size container, so the stage can be the largest 16:9 rectangle that fits it in both directions --
   sizing the stage rather than letterboxing the video keeps the drawing canvas exactly over the
   picture. Narrow screens fall back to a normal scrolling column. */
main{padding:10px 16px;height:100vh;display:flex;flex-direction:column;gap:8px}
h1{font-size:18px;font-weight:600;margin:0}
p.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;min-width:0}
/* The video box starts at the full-width video's height (54px = page and card padding and borders)
   and only shrinks when the window is too short, so a tall window leaves no gap under the video. */
.top{flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
.videobox{flex:0 1 auto;height:calc((100vw - 54px) * 9 / 16);min-height:120px;container-type:size;display:flex;justify-content:center}
.stage{position:relative;background:#000;border-radius:8px;overflow:hidden;width:min(100cqw,calc(100cqh * 16 / 9));align-self:flex-start;container-type:inline-size}
.panel{flex:none;height:clamp(136px,20vh,260px);display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:14px}
.panel>*{min-height:0;overflow:hidden}
#pitch{height:100%;width:auto;max-width:100%;aspect-ratio:1050/680}
@media (max-width:900px),(max-height:480px){
  main{height:auto;min-height:0}
  p.sub{white-space:normal}
  .videobox{flex:none;height:auto;container-type:normal}
  .stage{width:100%}
  .panel{height:auto;grid-template-columns:minmax(0,1fr)}
  #pitch{width:100%;max-width:560px;height:auto}
}
video{width:100%;height:auto;display:block}
#over{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* Scales with the video (the stage is an inline-size container), so it never swamps a small one. */
.hud{position:absolute;bottom:56px;left:10px;background:rgba(0,0,0,.72);color:#fff;border-radius:8px;padding:.4em .9em;font-size:clamp(10px,1.4cqw,14px);line-height:1.6;pointer-events:none}
.hud .row{display:flex;align-items:center;gap:.6em;white-space:nowrap}
.hud .k{color:#cfcdc6;width:4.6em;font-size:.86em}
.hud .dot{width:.8em;height:.8em;border-radius:50%;flex:none}
.hud b{font-weight:600}
canvas.full{width:100%;height:auto;display:block;border-radius:8px}
.striplabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
canvas.strip{width:100%;display:block;cursor:pointer;border-radius:4px;margin-top:2px}
#whole{height:16px}
#zoom{height:28px}
.keys{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-left:auto}
.keys span.k{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px}
button,select{font:inherit;font-size:14px;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 12px;cursor:pointer}
button:hover{background:var(--bg)}
label.tg{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:start}
.stat{background:var(--bg);border-radius:8px;padding:4px 10px;min-width:0}
.stat .l{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agree{font-size:12px;font-weight:600;margin-left:6px}
.legend{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
/* No video (outside matches): the pitch takes the video's place. */
.novideo .videobox{display:none}
/* Tall or square windows: read-outs in a row on top, the pitch full width below. Wide windows: the
   pitch fills the height, read-outs in a column beside it. */
.novideo .top{flex:none}
.novideo .panel{flex:1;height:auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.novideo .stats{grid-template-columns:repeat(6,minmax(0,1fr))}
.novideo .legend{flex-direction:row;flex-wrap:wrap;gap:4px 16px}
.novideo #pitch{flex:1 1 0;min-height:0;width:100%;height:auto;max-width:none;object-fit:contain;object-position:center top}
@media (min-aspect-ratio:16/10){
  .novideo .panel{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr)}
  .novideo #pitch{grid-row:1/3;height:100%}
  .novideo .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .novideo .legend{flex-direction:column}
}
.novideo label.tg:has(#showTrack){display:none}
@media (max-width:900px),(max-height:480px){.novideo .stats{grid-template-columns:repeat(3,minmax(0,1fr))}.novideo #pitch{flex:none;height:auto}}
/* Decomposition lanes: a label column with the value at the playhead, and a canvas per lane. */
.lanes{display:grid;grid-template-columns:minmax(150px,max-content) minmax(0,1fr);gap:1px 8px;margin-top:3px;font-size:12px;align-items:center}
.lanes .ln{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.lanes .ln b{color:var(--text);font-weight:600}
.lanes canvas{width:100%;height:16px;display:block;cursor:pointer;border-radius:2px;background:var(--bg)}
[hidden]{display:none!important}
.seg{display:inline-flex}.seg button{font-size:12px;padding:2px 10px;border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--text);color:var(--card)}
#scores b{color:var(--text)}
.hk{color:var(--home)}.ak{color:var(--away)}.dk{color:var(--dead)}.lk{color:var(--line)}
.err{margin-top:10px;color:var(--bad);font-size:14px}
</style>
</head>
<body>
<main>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px"><h1 id="title">Match viewer</h1><select id="games" aria-label="Switch game" hidden></select></div>
<p class="sub" id="sub"></p>
<div class="wrap">
  <div class="card top">
    <div class="videobox"><div class="stage">
      <video id="video" controls controlslist="nofullscreen" preload="auto" muted></video>
      <canvas id="over" width="1920" height="1080"></canvas>
      <div class="hud" id="hud">
        <div class="row" id="hudTruth"><span class="k">Truth</span><span class="dot"></span><b>–</b></div>
        <div class="row" id="hudPred"><span class="k">Estimate</span><span class="dot"></span><b>–</b></div>
        <div class="row" id="hudBall"><span class="k">Ball</span><b>–</b></div>
      </div>
    </div></div>
    <div class="striplabel"><span>Whole match</span><span id="wholeRange"></span></div>
    <canvas id="whole" class="strip" width="1200" height="30" aria-label="Possession over the whole match; click to seek"></canvas>
    <div class="striplabel"><span>Two minutes around the playhead</span><span id="zoomRange"></span></div>
    <canvas id="zoom" class="strip" width="1200" height="40" aria-label="Possession around the playhead; click to seek"></canvas>
    <div id="explain" hidden>
      <div class="striplabel"><span class="seg" id="level"><button data-l="0">Simple</button><button data-l="1">Why</button><button data-l="2">Every clue</button></span><span id="scores"></span></div>
      <div class="striplabel" id="barkey" hidden><span>Same two minutes as above · bars up lean <b class="hk">home</b> or <b class="dk">dead</b>, down lean <b class="ak">away</b> or <b class="lk">in play</b> · hover a name for what it is</span></div>
      <div class="lanes" id="lanes"></div>
    </div>
    <div class="controls">
      <button id="play">Play</button>
      <button id="back" title="Previous frame (←)">◀ frame</button>
      <button id="fwd" title="Next frame (→)">frame ▶</button>
      <select id="speed" aria-label="Playback speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option><option value="6">6×</option></select>
      <label class="tg"><input type="checkbox" id="showTrack" checked> Tracking on video</label>
      <label class="tg"><input type="checkbox" id="showIds" checked> Slot numbers</label>
      <div class="keys" id="keys"></div>
    </div>
    <div class="err" id="err" hidden></div>
  </div>
  <div class="card panel">
    <canvas id="pitch" width="1050" height="680" style="display:block;border-radius:8px"></canvas>
    <div class="stats">
      <div class="stat"><div class="l" id="lvtime">Video time</div><div class="v" id="vtime">–</div></div>
      <div class="stat"><div class="l">Game clock</div><div class="v" id="gtime">–</div></div>
      <div class="stat"><div class="l">True possession</div><div class="v" id="truth">–</div></div>
      <div class="stat"><div class="l" id="lhome">Home slots</div><div class="v" id="nhome">–</div></div>
      <div class="stat"><div class="l" id="laway">Away slots</div><div class="v" id="naway">–</div></div>
      <div class="stat" id="predbox"><div class="l" id="predlabel">Your estimate</div><div class="v"><span id="pred">–</span><span class="agree" id="agree"></span></div></div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</div>
</main>
<script>
const D = __COMBINED_DATA__;
const NF = D.n_frames, FPS = D.clock.fps, CH = D.chunk, NCH = Math.ceil(NF / CH), ZOOM = 60 * FPS;
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const side = s => D.teams[s];
const name = { H: D.names.H, A: D.names.A };
const LABEL = l => ({ H: [name.H, '--home'], A: [name.A, '--away'], D: ['Dead ball', '--dead'] }[l] || ['–', '--muted']);
// Fixed, bright colours for drawing on the video, which is the same in light and dark mode.
const ON_VIDEO = { H: '#4EA3F5', A: '#FF8A50', ball: '#FFE04A' };
const HAS_TRUTH = !!D.truth && /[HAD]/.test(D.truth);

function mmss(sec, decimals) {
  const q = Math.pow(10, decimals); sec = Math.floor(sec * q + 1e-6) / q;
  const m = Math.floor(sec / 60), s = sec - m * 60;
  return m + ':' + s.toFixed(decimals).padStart(decimals ? 3 + decimals : 2, '0');
}
function videoTime(v, decimals = 1) {
  const s = v / FPS;
  return s >= 3600 ? Math.floor(s / 3600) + ':' + mmss(s % 3600, decimals).padStart(decimals ? 4 + decimals : 5, '0') : mmss(s, decimals);
}
function gameClock(v) {
  const k = D.clock.kickoff, e = D.clock.end;
  const fmt = (el, base) => { const t = base + el, cap = base + 45 * 60; return t <= cap ? mmss(t, 0) : (cap / 60) + '+' + mmss(t - cap, 0); };
  if (v < k[0]) return 'Pre-match';
  if (v <= e[0]) return fmt((v - k[0]) / FPS, 0);
  if (v < k[1]) return 'Half-time';
  if (v <= e[1]) return fmt((v - k[1]) / FPS, 45 * 60);
  return 'Full time';
}

const NOVIDEO = !D.video;
if (NOVIDEO) document.body.classList.add('novideo');
if (D.games) {
  const g = $('games'), here = decodeURIComponent(location.pathname.split('/').pop());
  g.innerHTML = D.games.map(([l, f]) => '<option value="' + f + '"' + (f === here ? ' selected' : '') + '>' + l + '</option>').join('');
  g.hidden = false; g.onchange = () => { location.href = g.value; };
}
$('title').textContent = (D.match || name.H + ' vs ' + name.A) + ' — match viewer';
$('sub').title = $('sub').textContent = NOVIDEO
  ? 'Outside match: tracking only, no video. Truth is the provider\'s own label, not the challenge rule. ' +
    '← → step one frame, shift for a second, space plays.' + (D.pred ? ' Estimate from ' + D.pred_name + '.' : '')
  : 'The whole tactical video. Rings on the video are where the tracking puts each slot; ' +
  'a ring off a player, or a player with no ring, is the tracking being wrong. ← → step one frame, shift for a second, space plays.' +
  (D.pred ? ' Estimate from ' + D.pred_name + '.' : '') + (HAS_TRUTH ? ' Ground truth only covers video 7:27.4 – 12:27.4.' : '');
$('lhome').textContent = name.H + ' slots';
$('laway').textContent = name.A + ' slots';
if (!D.pred) { $('predbox').style.display = 'none'; $('hudPred').style.display = 'none'; }
else $('predlabel').textContent = 'Your estimate (' + D.pred_name + ')';
if (!HAS_TRUTH) $('hudTruth').style.display = 'none';
$('legend').innerHTML = [
  ['background:var(--home)', name.H + ' slot (number = slot ID, not a player)'],
  ['background:var(--away)', name.A + ' slot'],
  ['border:2px dashed var(--muted)', 'Hollow / dashed: no speed, position probably estimated'],
  ['background:' + ON_VIDEO.ball, 'Ball (on the video: yellow ring)'],
].map(([st, t]) => '<div><span class="sw" style="' + st + '"></span>' + t + '</div>').join('');
$('keys').innerHTML = [['--home', name.H], ['--away', name.A], ['--dead', 'Dead ball'], ['--none', 'No label']]
  .map(([c, t]) => '<span><span class="k" style="background:var(' + c + ')"></span>' + t + '</span>').join('') +
  '<span>' + (HAS_TRUTH ? 'Truth on top where it exists · ' : '') + (D.pred ? 'your estimate below · ' : '') + 'click to jump</span>';
$('wholeRange').textContent = '0:00 – ' + videoTime(NF - 1, 0);

// ---- tracking, loaded a minute at a time --------------------------------------------------
// Chunks are scripts rather than fetched JSON so the page also works opened straight from disk.
const chunks = new Map(), pending = new Set();
let cur = -1;
window.MATCH_CHUNK = (k, c) => {
  chunks.set(k, c); pending.delete(k);
  for (const old of chunks.keys()) if (Math.abs(old - Math.floor(cur / CH)) > 3) chunks.delete(old);
  if (Math.floor(cur / CH) === k) render(cur);
};
function want(k) {
  if (k < 0 || k >= NCH || chunks.has(k) || pending.has(k)) return;
  pending.add(k);
  const s = document.createElement('script');
  s.src = D.chunks + '/chunk_' + String(k).padStart(4, '0') + '.js';
  s.onload = () => s.remove();
  s.onerror = () => {
    pending.delete(k); s.remove();
    showErr("Couldn't load tracking chunk " + s.src + '. Regenerate the page with make_combined.py, which writes the chunks.');
  };
  document.head.appendChild(s);
}
function frameData(v) {
  const k = Math.floor(v / CH), j = v - k * CH;
  want(k);
  if (j > CH - 30 * FPS) want(k + 1);                        // load the next minute early: 5 s ahead even at 6×
  if (j < 5 * FPS) want(k - 1);
  const c = chunks.get(k);
  return c ? { slots: c.slots[j], ball: c.ball[j], H: c.H && c.H[j] } : null;
}

// ---- video on the clock -------------------------------------------------------------------
// Without a video, a timer with the bits of the <video> API this page uses stands in for it.
class Clock extends EventTarget {
  t = 0; last = 0; paused = true; playbackRate = 1; error = null;
  get currentTime() {
    if (!this.paused) {
      const now = performance.now();
      this.t = Math.min(NF / FPS, this.t + (now - this.last) / 1000 * this.playbackRate); this.last = now;
      if (this.t >= NF / FPS) this.pause();
    }
    return this.t;
  }
  set currentTime(t) { this.t = t; this.last = performance.now(); this.dispatchEvent(new Event('seeked')); }
  play() { this.paused = false; this.last = performance.now(); this.dispatchEvent(new Event('play')); }
  pause() { if (!this.paused) { this.paused = true; this.dispatchEvent(new Event('pause')); } }
}
const video = NOVIDEO ? new Clock() : $('video');
if (!NOVIDEO) video.src = D.video;
const timeOf = v => (v + 0.5) / FPS;                         // middle of the frame, never on an edge
const frameOf = t => Math.max(0, Math.min(NF - 1, Math.floor(t * FPS + 1e-3)));
function seekFrame(v) { video.currentTime = timeOf(Math.max(0, Math.min(NF - 1, v))); }

// ---- drawing on the video -----------------------------------------------------------------
const ov = $('over'), oc = ov.getContext('2d');
function project(h, x, y) {
  const d = h[6] * x + h[7] * y + h[8];
  return [(h[0] * x + h[1] * y + h[2]) / d, (h[3] * x + h[4] * y + h[5]) / d];
}
function drawVideo(f) {
  oc.clearRect(0, 0, ov.width, ov.height);
  if (!f || !f.H || !$('showTrack').checked) return;
  const h = f.H;
  oc.font = '600 22px -apple-system,sans-serif'; oc.textAlign = 'center';
  const ring = (x, y, colour, dashed, rx) => {
    const [u, v] = project(h, x, y), r = Math.max(6, Math.abs(project(h, x + 0.008, y)[0] - u)) * (rx || 1);
    oc.setLineDash(dashed ? [6, 5] : []);
    oc.lineWidth = 6; oc.strokeStyle = 'rgba(0,0,0,.55)';
    oc.beginPath(); oc.ellipse(u, v, r, r * 0.45, 0, 0, Math.PI * 2); oc.stroke();
    oc.lineWidth = 3; oc.strokeStyle = colour; oc.stroke();
    oc.setLineDash([]);
    return [u, v, r];
  };
  for (const [s, x, y, est] of f.slots) {
    const [u, v, r] = ring(x / 1000, y / 1000, ON_VIDEO[side(s)], est);
    if ($('showIds').checked) {
      oc.lineWidth = 4; oc.strokeStyle = 'rgba(0,0,0,.7)'; oc.strokeText(s, u, v + r * 0.45 + 22);
      oc.fillStyle = ON_VIDEO[side(s)]; oc.fillText(s, u, v + r * 0.45 + 22);
    }
  }
  if (f.ball) ring(f.ball[0] / 1000, f.ball[1] / 1000, ON_VIDEO.ball, false, 0.6);
}

// ---- top-down pitch ---------------------------------------------------------------------
const pc = $('pitch'), cx = pc.getContext('2d'), W = pc.width, PH = pc.height;
function drawPitch(f) {
  cx.fillStyle = css('--grass'); cx.fillRect(0, 0, W, PH);
  cx.strokeStyle = css('--line'); cx.lineWidth = 2;
  const sx = m => m / 105 * W, sy = m => m / 68 * PH;
  cx.strokeRect(2, 2, W - 4, PH - 4);
  cx.beginPath(); cx.moveTo(W / 2, 0); cx.lineTo(W / 2, PH); cx.stroke();
  cx.beginPath(); cx.arc(W / 2, PH / 2, sx(9.15), 0, Math.PI * 2); cx.stroke();
  for (const right of [false, true]) {
    const box = (w, h) => cx.strokeRect(right ? W - sx(w) : 0, (PH - sy(h)) / 2, sx(w), sy(h));
    box(16.5, 40.32); box(5.5, 18.32);
  }
  if (!f) {
    cx.fillStyle = css('--muted'); cx.font = '600 28px -apple-system,sans-serif'; cx.textAlign = 'center';
    cx.fillText('Loading tracking…', W / 2, PH / 2 - 60); return;
  }
  // Shade the part of the pitch the camera can see: cells whose centre projects inside the frame.
  // A grid test rather than the frame's corners, because the top of the frame is above the horizon.
  if (f.H) {
    const GX = 42, GY = 27;
    cx.fillStyle = css('--text'); cx.globalAlpha = 0.07;
    for (let gx = 0; gx < GX; gx++) for (let gy = 0; gy < GY; gy++) {
      const [u, v] = project(f.H, (gx + 0.5) / GX, (gy + 0.5) / GY);
      if (u >= 0 && u <= 1920 && v >= 0 && v <= 1080) cx.fillRect(gx / GX * W, gy / GY * PH, W / GX + 0.5, PH / GY + 0.5);
    }
    cx.globalAlpha = 1;
  }
  const C = { H: css('--home'), A: css('--away') }, CL = { H: css('--homel'), A: css('--awayl') };
  cx.font = '600 12px -apple-system,sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (const [s, x, y, est] of f.slots) {
    const u = x / 1000 * W, v = y / 1000 * PH, team = side(s);
    cx.beginPath(); cx.arc(u, v, 13, 0, Math.PI * 2);
    if (est) { cx.fillStyle = css('--grass'); cx.fill(); cx.strokeStyle = C[team]; cx.lineWidth = 2.5; cx.stroke(); }
    else { cx.fillStyle = C[team]; cx.fill(); }
    cx.fillStyle = est ? C[team] : CL[team]; cx.fillText(s, u, v + 0.5);
  }
  cx.textBaseline = 'alphabetic';
  if (f.ball) {
    cx.fillStyle = css('--ball'); cx.strokeStyle = css('--grass'); cx.lineWidth = 2;
    cx.beginPath(); cx.arc(f.ball[0] / 1000 * W, f.ball[1] / 1000 * PH, 6, 0, Math.PI * 2); cx.fill(); cx.stroke();
  }
}

// ---- possession strips ------------------------------------------------------------------
// Draw labels[a..b) across a canvas: truth on top where the range has any, the estimate below.
function paintLabels(ctx, SW, SH, a, b) {
  const colour = l => css({ H: '--home', A: '--away', D: '--dead' }[l] || '--none');
  const truthHere = HAS_TRUTH && /[HAD]/.test(D.truth.slice(Math.max(0, a), Math.min(NF, b)));
  const rows = [truthHere && D.truth, D.pred].filter(Boolean);
  if (!rows.length) rows.push(D.truth || '');
  const rh = (SH - (rows.length - 1) * 4) / rows.length;
  rows.forEach((labels, r) => {
    for (let x = 0; x < SW; x++) {
      const v = Math.floor(a + (x + 0.5) / SW * (b - a));
      ctx.fillStyle = colour(v >= 0 && v < NF ? labels[v] : 'X'); ctx.fillRect(x, r * (rh + 4), 1, rh);
    }
  });
}
const whole = $('whole'), wc = whole.getContext('2d'), wholeBase = document.createElement('canvas');
wholeBase.width = whole.width; wholeBase.height = whole.height;
paintLabels(wholeBase.getContext('2d'), whole.width, whole.height, 0, NF);
function drawWhole(v) {
  wc.clearRect(0, 0, whole.width, whole.height); wc.drawImage(wholeBase, 0, 0);
  wc.fillStyle = css('--text'); wc.fillRect(v / (NF - 1) * whole.width - 1, 0, 2, whole.height);
}
const zoom = $('zoom'), zc = zoom.getContext('2d');
let zoomFrom = -1;
function drawZoom(v) {
  const a = v - ZOOM, b = v + ZOOM;
  zc.clearRect(0, 0, zoom.width, zoom.height);
  paintLabels(zc, zoom.width, zoom.height, a, b);
  zc.fillStyle = css('--text'); zc.fillRect(zoom.width / 2 - 1, 0, 2, zoom.height);
  zoomFrom = a;
  $('zoomRange').textContent = videoTime(Math.max(0, a), 0) + ' – ' + videoTime(Math.min(NF - 1, b), 0);
}
const clickFrac = (e, el) => { const r = el.getBoundingClientRect(); return (e.clientX - r.left) / r.width; };
whole.onclick = e => seekFrame(Math.round(clickFrac(e, whole) * (NF - 1)));
zoom.onclick = e => seekFrame(Math.round(zoomFrom + clickFrac(e, zoom) * 2 * ZOOM));

// ---- the model's working, under the strips (make_combined.py --explain) -------------------
// Three levels, simplest first. Simple: the scores and the mistakes over the whole match. Why: around
// the playhead, the mistakes, whether the model saw the ball, and all clues together. Every clue:
// each clue's own lean and the guess before smoothing. Leans are log-odds: up = home (or dead),
// down = away (or in play).
const X = D.explain;
const lanes = [];
if (X) {
  $('explain').hidden = false;
  if (X.scores) $('scores').innerHTML = X.scores.map(([k, v]) => k + ' <b>' + v + '</b>').join(' · ');
  const dec = b => Int8Array.from(atob(b), c => c.charCodeAt(0));
  const wrong = Array.from(D.pred, (p, i) => { const t = D.truth ? D.truth[i] : 'X';
    return t === 'X' || p === 'X' ? 'X' : t === p ? 'O' : 'W'; }).join('');
  const ask = kind => kind === 'team' ? ' · who has it' : ' · in play?';
  if (HAS_TRUTH) lanes.push({ lvl: 0, name: 'Mistakes, whole match', str: wrong, whole: true, note: 'Red where the model disagrees with the truth. Click to jump there.' });
  if (HAS_TRUTH) lanes.push({ lvl: 1, name: 'Mistakes here', str: wrong, note: 'Red where the model disagrees with the truth' });
  lanes.push({ lvl: 1, name: 'Ball seen', str: X.seen, note: 'Whether the model could see the ball' + (D.match ? ', after knocking it out to 59% like our match' : '') });
  const each = X.lanes.filter(([n]) => !n.startsWith('all ')), all = X.lanes.filter(([n]) => n.startsWith('all '));
  all.forEach(([, kind, b]) => lanes.push({ lvl: 1, name: 'All clues' + ask(kind), kind, v: dec(b), sum: true,
    note: 'Every clue added up and weighted: what the smoothing works from' }));
  lanes.push({ lvl: 2, name: 'Guess before smoothing', str: X.raw, note: 'The best label for each frame on its own, before Viterbi smooths it' });
  each.forEach(([name, kind, b]) => lanes.push({ lvl: 2, name: name + ask(kind), kind, v: dec(b), note: 'One clue on its own, before weighting' }));
  const box = $('lanes');
  for (const l of lanes) {
    l.label = document.createElement('div'); l.label.className = 'ln'; l.label.title = l.note || l.name;
    l.cv = document.createElement('canvas'); l.cv.width = 1000; l.cv.height = 16;
    l.cv.onclick = e => seekFrame(Math.round(l.whole ? clickFrac(e, l.cv) * (NF - 1) : zoomFrom + clickFrac(e, l.cv) * 2 * ZOOM));
    box.append(l.label, l.cv);
  }
  let level = 0;
  try { level = +localStorage.getItem('explainLevel') || 0; } catch (e) {}
  const setLevel = n => {
    level = n;
    try { localStorage.setItem('explainLevel', n); } catch (e) {}
    for (const b of $('level').children) b.classList.toggle('on', +b.dataset.l === n);
    for (const l of lanes) l.label.hidden = l.cv.hidden = l.lvl > n;
    $('barkey').hidden = n === 0;
    if (cur >= 0) drawLanes(cur);
  };
  for (const b of $('level').children) b.onclick = () => setLevel(+b.dataset.l);
  setLevel(level);
}
const LANE_COL = { H: '--home', A: '--away', D: '--dead', W: '--bad', 1: '--ball' };
function drawLanes(v) {
  if (!X) return;
  const memo = {}, css = n => memo[n] || (memo[n] = getComputedStyle(document.documentElement).getPropertyValue(n).trim());
  const a = v - ZOOM, b = v + ZOOM;
  for (const l of lanes) {
    if (l.cv.hidden) continue;
    if (l.whole && l.drawn) { l.ctx.putImageData(l.drawn, 0, 0); } else {
      const c = l.ctx = l.cv.getContext('2d'), W = l.cv.width, H = l.cv.height;
      const [lo, hi] = l.whole ? [0, NF] : [a, b];
      c.clearRect(0, 0, W, H);
      for (let x = 0; x < W; x++) {
        const f0 = Math.floor(lo + x / W * (hi - lo)), f1 = Math.max(f0 + 1, Math.floor(lo + (x + 1) / W * (hi - lo)));
        if (f1 <= 0 || f0 >= NF) continue;
        if (l.str) {
          let k = l.str[Math.min(NF - 1, Math.max(0, Math.floor((f0 + f1) / 2)))];
          if (l.whole) for (let f = Math.max(0, f0); f < Math.min(NF, f1); f++) if (l.str[f] === 'W') { k = 'W'; break; }
          if (!LANE_COL[k]) continue;
          c.fillStyle = css(LANE_COL[k]); c.fillRect(x, 0, 1, H);
        } else {
          let s = 0, n = 0;
          for (let f = Math.max(0, f0); f < Math.min(NF, f1); f++) { s += l.v[f]; n++; }
          const m = s / n / 10, h = Math.tanh(Math.abs(m) / (l.sum ? 1 : 2)) * (H / 2);
          if (h < 0.3) continue;
          c.fillStyle = css(m > 0 ? (l.kind === 'team' ? '--home' : '--dead') : (l.kind === 'team' ? '--away' : '--line'));
          c.fillRect(x, m > 0 ? H / 2 - h : H / 2, 1, h);
        }
      }
      if (l.whole) l.drawn = c.getImageData(0, 0, W, H);
    }
    l.ctx.fillStyle = css('--text');
    l.ctx.fillRect(l.whole ? v / (NF - 1) * l.cv.width - 1 : l.cv.width / 2 - 1, 0, 2, l.cv.height);
    let here = '';
    if (l.v) {
      const m = l.v[v] / 10, k = l.kind === 'team' ? (m > 0 ? 'home' : 'away') : (m > 0 ? 'dead' : 'in play');
      here = Math.abs(m) < 0.05 ? 'no lean' : k + ' ' + (m > 0 ? '+' : '−') + Math.abs(m).toFixed(1);
    } else if (!l.whole) here = l.name === 'Ball seen' ? (l.str[v] === '1' ? 'yes' : 'no') : (LABEL(l.str[v])[0] === '–' ? (l.str[v] === 'W' ? 'wrong' : l.str[v] === 'O' ? 'right' : '–') : LABEL(l.str[v])[0]);
    l.label.innerHTML = l.name + (here ? ' <b>' + here + '</b>' : '');
  }
}

// ---- read-outs --------------------------------------------------------------------------
function hudRow(id, label, none) {
  const [text, colour] = label === 'X' ? [none, '--none'] : LABEL(label);
  const row = $(id); row.querySelector('b').textContent = text;
  row.querySelector('.dot').style.background = label === 'X' ? 'transparent' : css(colour);
}
function readouts(v, f) {
  let nh = 0, na = 0;
  if (f) for (const [s] of f.slots) side(s) === 'H' ? nh++ : na++;
  $('nhome').textContent = f ? nh : '–'; $('naway').textContent = f ? na : '–';
  $('vtime').textContent = videoTime(v);
  $('lvtime').textContent = (NOVIDEO ? 'Match time' : 'Video time') + ' · frame ' + v;
  $('gtime').textContent = gameClock(v);
  $('hudBall').querySelector('b').textContent = !f ? 'loading…' : f.ball ? 'tracked' : 'missing from tracking';
  const t = D.truth ? D.truth[v] : 'X';
  const tl = LABEL(t);
  $('truth').textContent = t === 'X' ? 'No ground truth here' : tl[0];
  $('truth').style.color = t === 'X' ? css('--muted') : css(tl[1]);
  if (HAS_TRUTH) hudRow('hudTruth', t, 'No ground truth');
  if (D.pred) {
    const p = D.pred[v], pl = LABEL(p);
    $('pred').textContent = p === 'X' ? 'No answer (X)' : pl[0];
    $('pred').style.color = p === 'X' ? css('--muted') : css(pl[1]);
    hudRow('hudPred', p, 'No answer (X)');
    const ag = $('agree');
    if (t === 'X' || p === 'X') ag.textContent = '';
    else if (t === p) { ag.textContent = '✓ matches'; ag.style.color = css('--ok'); }
    else { ag.textContent = '✗ differs'; ag.style.color = css('--bad'); }
  }
}

// ---- one clock: the video ---------------------------------------------------------------
function render(v) {
  const f = frameData(v);
  drawVideo(f); drawPitch(f); readouts(v, f); drawWhole(v); drawZoom(v); drawLanes(v);
}
function update(mediaTime, force) {
  const v = frameOf(mediaTime);
  if (v === cur && !force) return;
  cur = v; render(v);
}
if (!NOVIDEO && 'requestVideoFrameCallback' in HTMLVideoElement.prototype) {
  const onFrame = (now, meta) => { update(meta.mediaTime); video.requestVideoFrameCallback(onFrame); };
  video.requestVideoFrameCallback(onFrame);
} else {
  const loop = () => { update(video.currentTime); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
function showErr(msg) { const e = $('err'); e.hidden = false; e.textContent = msg; }
const startFrame = (() => { const m = /^#f(\d+)$/.exec(location.hash); return m ? Math.min(NF - 1, +m[1]) : NOVIDEO ? 0 : 11185; })();
if (NOVIDEO) video.currentTime = timeOf(startFrame);
video.addEventListener('seeked', () => update(video.currentTime, true));
video.addEventListener('loadedmetadata', () => seekFrame(startFrame));
video.addEventListener('play', () => $('play').textContent = 'Pause');
video.addEventListener('pause', () => $('play').textContent = 'Play');
video.addEventListener('error', () => showErr("Couldn't load the video at " + D.video + ' (relative to this page). ' +
  'Keep the page where make_combined.py wrote it, or regenerate it with --out. The tracking views still work: use the strips and the frame buttons.'));

const step = d => {
  video.pause();
  const v = Math.max(0, Math.min(NF - 1, (cur < 0 ? startFrame : cur) + d));
  seekFrame(v); if (video.error) update(timeOf(v), true);
};
$('play').onclick = () => video.paused ? video.play() : video.pause();
$('back').onclick = () => step(-1);
$('fwd').onclick = () => step(1);
$('speed').onchange = () => video.playbackRate = parseFloat($('speed').value);
$('showTrack').onchange = $('showIds').onchange = () => render(cur);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); step(e.shiftKey ? -25 : -1); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); step(e.shiftKey ? 25 : 1); }
});
update(timeOf(startFrame), true);
</script>
</body>
